<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico e Exportação CSV - Monitoramento CA</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
        h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }
        .subtitle { font-size: 0.9rem; color: #94a3b8; margin-top: 5px; }
        .btn-nav { background: #334155; color: #f8fafc; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; }
        .card { background: #1e293b; border-radius: 12px; padding: 25px; border: 1px solid #334155; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        button { border: none; padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-right: 8px; }
        .btn-reload { background: #38bdf8; color: #0f172a; }
        .btn-csv { background: #4ade80; color: #0f172a; }
        input[type="date"] { background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 9px 14px; border-radius: 6px; color-scheme: dark; }
        .status-text { font-size: 0.95rem; color: #94a3b8; margin-bottom: 15px; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 12px 10px; text-align: center; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; text-transform: uppercase; font-size: 0.8rem; }
        tr:hover { background: #263349; }
        .val-min { color: #38bdf8; }
        .val-max { color: #fbbf24; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>📊 Histórico de Medições e Exportação</h1>
            <div class="subtitle">Registros consolidados a cada 1 minuto (IEC 61000-4-30)</div>
        </div>
        <a href="index.html" class="btn-nav">⚡ Voltar ao Tempo Real</a>
    </header>
    <div class="card">
        <div class="toolbar">
            <div>
                <button class="btn-reload" onclick="carregarDados()">🔄 Atualizar Lista</button>
                <button class="btn-csv" onclick="baixarCSV()">📥 Baixar Planilha .CSV</button>
            </div>
            <div>
                <label for="filtro-data" style="font-size:0.85rem;color:#94a3b8;margin-right:8px;">Filtrar dia:</label>
                <input type="date" id="filtro-data" onchange="aplicarFiltro()">
            </div>
        </div>
        <div class="status-text" id="status">Iniciando...</div>
        <div class="table-wrapper">
            <table id="tabela">
                <thead>
                    <tr>
                        <th>Abertura da Janela</th>
                        <th>Vrms Méd (V)</th>
                        <th>Vrms Mín (V)</th>
                        <th>Vrms Máx (V)</th>
                        <th>Freq Méd (Hz)</th>
                        <th>Freq Mín (Hz)</th>
                        <th>Freq Máx (Hz)</th>
                        <th>Amostras</th>
                        <th>Perdidas</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // COLE AQUI A URL DO SEU FIREBASE (terminando em /historico.json)
    // =========================================================================
    const FIREBASE_HISTORICO_URL = "https://medidor-esp32-6826e-default-rtdb.firebaseio.com/historico.json";
    // =========================================================================

    let dadosCompletos = [];
    let dadosFiltrados = [];

    async function carregarDados() {
        const status = document.getElementById("status");
        status.innerText = "Buscando registros no Firebase...";

        try {
            const resposta = await fetch(FIREBASE_HISTORICO_URL);
            if (!resposta.ok) throw new Error("HTTP " + resposta.status);

            const json = await resposta.json();
            if (!json) {
                status.innerText = "Nenhum registro encontrado no nó /historico ainda.";
                return;
            }

            dadosCompletos = Object.values(json).sort((a, b) => (a.data_hora || "").localeCompare(b.data_hora || ""));
            aplicarFiltro();
        } catch (erro) {
            status.innerText = "Erro ao conectar: " + erro.message;
        }
    }

    function aplicarFiltro() {
        const dataSelecionada = document.getElementById("filtro-data").value;
        const status = document.getElementById("status");

        dadosFiltrados = dataSelecionada
            ? dadosCompletos.filter(item => (item.data_hora || "").startsWith(dataSelecionada))
            : [...dadosCompletos];

        const tbody = document.querySelector("#tabela tbody");
        tbody.innerHTML = "";

        dadosFiltrados.slice(-50).reverse().forEach(item => {
            const corPerd = item.perdidas > 0 ? "#f87171" : "#4ade80";
            tbody.innerHTML += "<tr>" +
                "<td><strong>" + (item.data_hora || "--") + "</strong></td>" +
                "<td>" + Number(item.vrms_med).toFixed(2) + "</td>" +
                "<td class='val-min'>" + Number(item.vrms_min).toFixed(2) + "</td>" +
                "<td class='val-max'>" + Number(item.vrms_max).toFixed(2) + "</td>" +
                "<td>" + Number(item.freq_med).toFixed(2) + "</td>" +
                "<td class='val-min'>" + Number(item.freq_min).toFixed(2) + "</td>" +
                "<td class='val-max'>" + Number(item.freq_max).toFixed(2) + "</td>" +
                "<td>" + item.amostras + "</td>" +
                "<td style='color:" + corPerd + ";font-weight:bold'>" + item.perdidas + "</td>" +
            "</tr>";
        });

        status.innerText = "Total de " + dadosFiltrados.length + " minutos carregados.";
    }

    function baixarCSV() {
        if (dadosFiltrados.length === 0) {
            alert("Não há dados disponíveis para exportar!");
            return;
        }

        let csv = "Data_Hora;Vrms_Med;Vrms_Min;Vrms_Max;Freq_Med;Freq_Min;Freq_Max;Amostras;Perdidas\n";
        const fmt = (n) => Number(n).toFixed(2).replace(".", ",");

        dadosFiltrados.forEach(item => {
            csv += (item.data_hora || "") + ";" +
                   fmt(item.vrms_med) + ";" + fmt(item.vrms_min) + ";" + fmt(item.vrms_max) + ";" +
                   fmt(item.freq_med) + ";" + fmt(item.freq_min) + ";" + fmt(item.freq_max) + ";" +
                   item.amostras + ";" + item.perdidas + "\n";
        });

        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "historico_qualidade_energia.csv";
        link.click();
    }

    carregarDados();
</script>
</body>
</html>
